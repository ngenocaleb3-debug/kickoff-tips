name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Insert Firebase Android config
        run: cp google-services.json android/app/google-services.json

      - name: Add Google Services Gradle plugin (project-level)
        working-directory: android
        run: |
          sed -i '/dependencies {/a \        classpath("com.google.gms:google-services:4.4.2")' build.gradle

      - name: Apply Google Services Gradle plugin (app-level)
        working-directory: android
        run: |
          echo 'apply plugin: "com.google.gms.google-services"' >> app/build.gradle

      - name: Add AdMob App ID to AndroidManifest
        working-directory: android
        run: |
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-tips-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
