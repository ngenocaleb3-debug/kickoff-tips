name: Generate Release Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias kickofftips \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Eldoret2019!" \
            -keypass "Eldoret2019!" \
            -dname "CN=Kickoff Tips, OU=Kickoff Tips, O=Kickoff Tips, L=Nairobi, ST=Narok, C=KE"

      - name: Base64-encode keystore for storing as a secret
        run: base64 -w 0 release.keystore > release.keystore.b64

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.b64
